previews:
  generation: off

services:
  - type: web
    name: talimga-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: PROJECT_NAME
        value: Lotin tili va tibbiy terminologiya API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: talimga-db
          property: connectionString
      - key: DATABASE_POOL_SIZE
        value: "20"
      - key: DATABASE_MAX_OVERFLOW
        value: "40"
      - key: DATABASE_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: TOPIC_PASSING_SCORE
        value: "70"
      - key: CERTIFICATE_QUESTION_COUNT
        value: "50"
      - key: CERTIFICATE_PASSING_SCORE
        value: "70"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_CERTS_TIMEOUT_SECONDS
        value: "5"
      - key: UPLOAD_MAX_BYTES
        value: "5242880"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: SEED_ON_STARTUP
        value: "false"
      - key: DEBUG
        value: "false"

databases:
  - name: talimga-db
    plan: basic-256mb
    region: oregon
    databaseName: latin_med_terms
    user: latin_med_terms
